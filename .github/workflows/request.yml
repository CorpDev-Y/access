name: request

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" -R "$REPO" --add-label access-request > /dev/null

      - name: notify
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHOR: ${{ github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          login=$(printf '%s' "$TITLE" | grep -oE '^@[A-Za-z0-9-]{1,39}$' | tr -d '@' || true)
          [ -n "$login" ] || login="$AUTHOR"
          text="Заявка на доступ: @$login"
          if [ "$login" != "$AUTHOR" ]; then text="$text (подал @$AUTHOR)"; fi
          text="$text. Откройте панель скиллов: заявка будет первой на странице."
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}"
