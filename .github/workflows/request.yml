name: request

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" -R "$REPO" --add-label access-request > /dev/null

      - name: notify
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHOR: ${{ github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          login=$(printf '%s' "$TITLE" | grep -oE '^@[A-Za-z0-9-]{1,39}$' | tr -d '@' || true)
          [ -n "$login" ] || login="$AUTHOR"
          text=$(printf 'Заявка на доступ: @%s' "$login")
          tail_text='Решение: в панели, раздел «Заявки на доступ»'
          if [ "$login" != "$AUTHOR" ]; then text=$(printf '%s\nподал @%s' "$text" "$AUTHOR"); fi
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}

${tail_text}" \
            --data-urlencode "disable_web_page_preview=true"
